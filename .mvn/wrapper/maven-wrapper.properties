# Maven Wrapper settings. GitHub Actions runs ./mvnw (Linux, macOS) or mvnw.cmd (Windows),
# which downloads exactly this Maven version, so every runner builds with the same Maven.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
